name: Backend CI/CD to Render

on:
  push:
    branches:
      - fe_v2
    paths:
      - 'be-node-js/**'
      - 'render.yaml'
      - '.github/workflows/backend-render-deploy.yml'
  workflow_dispatch:

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: test-secret
      JWT_EXPIRES_IN: 7d
      REFRESH_TOKEN_TTL_MS: 2592000000
      AUTH_RATE_LIMIT_WINDOW_MS: 900000
      AUTH_RATE_LIMIT_MAX: 8
      PORT: 4000
      SERVER_IP: 127.0.0.1
      PHONE_IP: http://127.0.0.1:8080
      MONGO_URI: mongodb://127.0.0.1:27017/test
      MQTT_BROKER_URL: mqtts://test.invalid
      MQTT_PORT: 8883
      MQTT_CLIENT_ID: test-client
      MQTT_CLEAN: 'true'
      MQTT_RECONNECT_PERIOD_MS: 1000
      MQTT_CONNECT_TIMEOUT_MS: 30000
      MQTT_CA_CERT_PATH: ./CERT.txt
      HIVEMQ_USERNAME: test
      HIVEMQ_PASSWORD: test
      MQTT_FIRE_ALARM_TOPIC: MQ135/FireAlarm
      MQTT_MQ135_STATISTICS_TOPIC: MQ135/Statistics
      MQTT_DHT22_STATISTICS_TOPIC: DHT22/Statistics
      MQTT_LIGHTS_CONTROL_TOPIC: lights/01/server
      MQTT_LIGHT_SENSOR_TOPIC: lights/01/sensor
      MQTT_LIGHT_SENSOR_CONTROL_TOPIC: lights/01/sensorControl
      MQTT_LIGHTS_RESPONSE_TOPIC: lights/01/button
      MQTT_FANS_CONTROL_TOPIC: fans/01/server
      MQTT_FANS_RESPONSE_TOPIC: fans/01/button
      MQTT_MQ135_PERIOD_TOPIC: MQ135/Period
      DEFAULT_FAN_NAME: QUAT_1
      DEFAULT_LIGHT_NAME: DEN_PH
      TIMEZONE: Asia/Ho_Chi_Minh
      AUTO_CHECK_INTERVAL_MS: 30000
      AUTO_FAN_ON_BAD_AIR: 'true'
      AUTO_FAN_CO_THRESHOLD: 35
      AUTO_FAN_CO2_THRESHOLD: 1000
    defaults:
      run:
        working-directory: be-node-js
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: be-node-js/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy backend to Render
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/fe_v2'
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Missing GitHub secret: RENDER_DEPLOY_HOOK_URL"
            exit 1
          fi

          curl --fail --request POST "$RENDER_DEPLOY_HOOK_URL"
